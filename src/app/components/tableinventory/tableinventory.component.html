<div class="table-inventory-container">
  <h2>Inventory Management</h2>

  <mat-card class="add-item-card">
    <mat-card-header>
      <mat-card-title>Add New Item</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>Title</mat-label>
          <input matInput placeholder="Enter title" [(ngModel)]="newItem.title">
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Description</mat-label>
          <input matInput placeholder="Enter description" [(ngModel)]="newItem.description">
        </mat-form-field>
      </div>
    </mat-card-content>
    <mat-card-actions>
      <button mat-raised-button color="primary" (click)="addItem()">Add Item</button>
      <button mat-button (click)="resetForm()">Reset</button>
    </mat-card-actions>
  </mat-card>

  <mat-card class="items-table-card">
    <mat-card-header>
      <mat-card-title>Items List</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div class="mat-elevation-z2">
        <mat-table class="items-table" #table [dataSource]="dataSource">

          <ng-container matColumnDef="id">
            <mat-header-cell *matHeaderCellDef> No. </mat-header-cell>
            <mat-cell *matCellDef="let item"> {{item.id}} </mat-cell>
          </ng-container>

          <ng-container matColumnDef="title">
            <mat-header-cell *matHeaderCellDef> Title </mat-header-cell>
            <mat-cell *matCellDef="let item"> {{item.title}} </mat-cell>
          </ng-container>

          <ng-container matColumnDef="description">
            <mat-header-cell *matHeaderCellDef> Description </mat-header-cell>
            <mat-cell *matCellDef="let item"> {{item.description}} </mat-cell>
          </ng-container>

          <ng-container matColumnDef="actions">
            <mat-header-cell *matHeaderCellDef> Actions </mat-header-cell>
            <mat-cell *matCellDef="let item">
              <button mat-button color="warn" (click)="deleteItem(item.id)">Delete</button>
            </mat-cell>
          </ng-container>

          <mat-header-row *matHeaderRowDef="inventoryColumns"></mat-header-row>
          <mat-row *matRowDef="let myrow; columns: inventoryColumns;"></mat-row>
        </mat-table>
      </div>
    </mat-card-content>
  </mat-card>
</div>
